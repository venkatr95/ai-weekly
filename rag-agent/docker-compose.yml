services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://rag:rag@db:5432/rag
      VECTOR_STORE: postgres
      XAI_API_KEY: ${XAI_API_KEY:-}
      XAI_BASE_URL: ${XAI_BASE_URL:-https://api.x.ai/v1}
      LLM_MODEL: ${LLM_MODEL:-grok-4.7}
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-auto}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-embed-latest}
      REASONING_EFFORT: ${REASONING_EFFORT:-low}
      CHUNK_SIZE_TOKENS: ${CHUNK_SIZE_TOKENS:-500}
      CHUNK_OVERLAP_TOKENS: ${CHUNK_OVERLAP_TOKENS:-100}
      TOP_K: ${TOP_K:-5}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  pgdata:
